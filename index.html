<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>展示会 注文管理</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="styles.css?v=20260915-english1">
<script src="online-config.js?v=20260915-english1"></script>
</head>
<body>
<div id="toast" class="toast" aria-live="polite"></div>
<section id="loginView" class="login hidden">
  <div class="loginBox">
    <div class="brandMark">SN</div>
    <h1>展示会 注文管理</h1>
    <p>スタッフ専用の注文アプリです。ログイン状態はこの端末に保持されます。</p>
    <label>メール<input id="loginEmail" type="email" autocomplete="username"></label>
    <label>パスワード<input id="loginPassword" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" type="button" class="primary">ログイン</button>
    <p class="loginRememberNote">自分の業務端末でご利用ください。共用端末では利用後にログアウトしてください。</p>
    <div id="loginNetworkGuide" class="loginNetworkGuide hidden">現在オフラインです。登録スタッフのログインには再接続が必要です。</div>
    <div id="loginMsg" class="errorText"></div>
  </div>
</section>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brandRow">
      <div><div class="eyebrow" id="eventName">EXHIBITION</div><h1>注文管理</h1></div>
      <button id="refreshBtn" class="secondary compact" aria-label="注文と商品を同期する">↻ 同期</button>
    </div>
    <div class="syncLine"><span id="syncDot" class="syncDot"></span><span id="syncText">認証状態を確認中</span><button id="logoutBtn" class="linkBtn hidden">ログアウト</button></div>
    <div class="orderOverview">
      <div><small>保存済み注文</small><b id="orderCount">0件</b></div>
      <div><small>本日の注文</small><b id="todayOrderCount">0件</b></div>
    </div>
  </header>

  <main>
    <div id="tabs" class="tabs" role="tablist" aria-label="注文の状態"></div>
    <div class="toolbar">
      <div class="searchWrap"><span>⌕</span><input id="orderSearch" type="search" placeholder="お渡し番号・店舗・受付番号・電話・品番・商品名"></div>
    </div>
    <button id="printMenuBtn" class="secondary printMenuButton">展示会の全注文データを印刷</button>
    <div id="searchSummary" class="searchSummary">新しい注文から表示しています</div>
    <section id="orders" class="orders"></section>
  </main>
  <div class="newOrderActions">
    <button id="newOrderBtn" class="newOrderBtn">＋ 新しい注文</button>
    <button id="discardDraftBtn" class="discardDraftBtn hidden">破棄して新しい注文</button>
  </div>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheetPanel">
    <header class="sheetHead"><div><small id="stepLabel"></small><h2 id="sheetTitle">新しい注文</h2></div><button id="closeSheet" type="button" class="iconBtn" aria-label="閉じる">×</button></header>
    <div id="sheetError" class="errorBox hidden"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="printArea" class="printArea"></div>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script type="module" src="app.js?v=20260915-english1"></script>
</body>
</html>
