<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>展示会 注文管理</title>
<link rel="stylesheet" href="styles.css?v=20260810-qr11">
<script src="online-config.js?v=20260810-qr11"></script>
</head>
<body>
<div id="toast" class="toast" aria-live="polite"></div>
<section id="loginView" class="login hidden">
  <div class="loginBox">
    <div class="brandMark">SN</div>
    <h1>展示会 注文管理</h1>
    <p>登録スタッフでログインすると、全員の注文画面が自動同期されます。</p>
    <label>メール<input id="loginEmail" type="email" autocomplete="username"></label>
    <label>パスワード<input id="loginPassword" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" type="button" class="primary">ログイン</button>
    <button id="demoBtn" type="button" class="secondary">端末モード（共有されません）</button>
    <div id="loginMsg" class="errorText"></div>
  </div>
</section>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brandRow">
      <div><div class="eyebrow" id="eventName">EXHIBITION</div><h1>注文管理</h1></div>
      <button id="refreshBtn" class="iconBtn" aria-label="更新">↻</button>
    </div>
    <div class="syncLine"><span id="syncDot" class="syncDot"></span><span id="syncText">端末モード</span><button id="logoutBtn" class="linkBtn hidden">ログアウト</button></div>
    <div class="metrics">
      <button class="metric danger" data-filter="unshared"><small>本社未共有</small><b id="metricUnshared">0</b></button>
      <button class="metric" data-filter="pickup"><small>受取待ち</small><b id="metricPickup">0</b></button>
      <button class="metric warn" data-filter="unpaid"><small>未会計</small><b id="metricUnpaid">0</b></button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="active" class="active">要対応 <span id="countActive">0</span></button>
      <button data-tab="waiting">受取待ち <span id="countWaiting">0</span></button>
      <button data-tab="done">完了 <span id="countDone">0</span></button>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <div class="searchWrap"><span>⌕</span><input id="orderSearch" type="search" placeholder="店舗・受付番号・電話・品番"></div>
      <button id="filterBtn" class="secondary compact">絞込</button>
    </div>
    <button id="printMenuBtn" class="secondary printMenuButton">印刷・PDF</button>
    <div id="activeFilter" class="activeFilter hidden"></div>
    <section id="orders" class="orders"></section>
  </main>
  <button id="newOrderBtn" class="newOrderBtn">＋ 新しい注文</button>
</div>

<section id="receiptView" class="receiptPage hidden">
  <div class="receiptActions">
    <button id="closePublicReceipt" class="secondary">閉じる</button>
  </div>
  <section id="receiptImagePanel" class="receiptImagePanel preparing" aria-live="polite">
    <div class="receiptImagePanelHead">
      <div>
        <div class="receiptImagePanelTitle">画像の注文控え</div>
        <span id="receiptImageStatus" class="receiptImageStatus">画像を準備中…</span>
      </div>
      <button id="retryReceiptImage" class="receiptImageRetry secondary small hidden" type="button">もう一度作る</button>
    </div>
    <div class="deviceSaveGuide">
      <b>スマートフォンへの保存方法</b>
      <p>下の注文控え画像を長押しして、「写真に保存」または「画像を保存」を選んでください。</p>
    </div>
    <div class="receiptImagePreviewFrame">
      <div id="receiptImagePreparing" class="receiptImagePreparing">少しお待ちください</div>
      <img id="receiptImagePreview" class="receiptImagePreview" alt="長押しして保存できるお客様控え画像">
    </div>
  </section>
  <div id="receiptCard" class="receiptSheet"></div>
</section>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheetPanel">
    <header class="sheetHead"><div><small id="stepLabel"></small><h2 id="sheetTitle">新しい注文</h2></div><button id="closeSheet" type="button" class="iconBtn" aria-label="閉じる">×</button></header>
    <div id="sheetError" class="errorBox hidden"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="printArea" class="printArea"></div>
<script src="vendor/qrcode.min.js?v=20260810-qr11"></script>
<script src="vendor/html2canvas.min.js?v=20260810-qr11"></script>
<script type="module" src="app.js?v=20260810-qr11"></script>
</body>
</html>
