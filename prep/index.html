<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>展示会準備・設営</title>
  <script src="../online-config.js"></script>
</head>
<body>
  <main>
    <h1>展示会準備・設営</h1>
    <p id="message">準備画面の公開設定を確認してください。</p>
    <p><a id="openPreparation" hidden>準備・設営を開く</a></p>
    <p><a href="../">注文ツールへ</a></p>
  </main>
  <script>
    const deployment = window.EXHIBITION_CONFIG?.preparationUrl || '';
    if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(deployment)) {
      const destination = new URL(deployment);
      const query = new URLSearchParams(window.location.search);
      const event = query.get('event') || '';
      const box = query.get('box') || '';
      if (/^[a-zA-Z0-9_-]{1,128}$/.test(event)) destination.searchParams.set('event', event);
      if (/^SN-B[0-9]{3,8}$/.test(box)) destination.searchParams.set('box', box);
      document.getElementById('message').textContent = '準備・設営の画面を開いています。';
      const link = document.getElementById('openPreparation');
      link.href = destination.href;
      link.hidden = false;
      window.location.replace(destination.href);
    }
  </script>
</body>
</html>
